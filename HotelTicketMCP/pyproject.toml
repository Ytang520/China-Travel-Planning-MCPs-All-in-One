[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-ticket-mcp-server"
version = "0.1.0"
description = "基于模型上下文协议(MCP)的携程酒店搜索服务器（网页抓取，需登录态）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "hotel", "ctrip", "search", "ai", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.8.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "DrissionPage>=4.1.1.4",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hotel_ticket_mcp_server*"]
exclude = ["tests*", "logs*"]

[tool.pytest.ini_options]
# 系统 TEMP 目录存在访问限制（WinError 5），测试临时目录固定在项目内
addopts = "--basetemp=.pytest-tmp"
